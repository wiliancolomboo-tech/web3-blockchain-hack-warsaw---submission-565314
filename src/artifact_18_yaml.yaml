version: '3.8'

services:
  solaegis-relay-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solaegis_telemetry_worker
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=AegisVau1t1111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ENTERPRISE_AUDIT_EMAIL=${ENTERPRISE_AUDIT_EMAIL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"