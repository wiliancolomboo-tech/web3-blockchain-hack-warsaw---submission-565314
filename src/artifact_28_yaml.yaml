version: "3.8"

services:
  solveritas-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solveritas-event-relay
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=Ver1tasRkxQ8gVnmUoE2RjF4yZtB9sV8Kx1wPjN7Mno
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_enterprise_key_12345
      - RESEND_FROM_EMAIL=alerts@solveritas.network
      - RESEND_ALERT_TO=devops-alerts@enterprise.corp
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(process.uptime())' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"