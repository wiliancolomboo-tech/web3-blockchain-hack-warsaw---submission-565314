[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.18"

[features]
resolution = true
skip-lint = false

[programs.localnet]
anchor_shield = "8b2Yv8VvJvV5P1D3xL9vU8wK7zN9mK1jL5sW2eR4tQ6m"

[programs.devnet]
anchor_shield = "8b2Yv8VvJvV5P1D3xL9vU8wK7zN9mK1jL5sW2eR4tQ6m"

[registry]
