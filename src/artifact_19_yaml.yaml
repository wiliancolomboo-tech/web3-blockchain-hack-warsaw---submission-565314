version: "3.8"

services:
  warsaw-arbiter-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warsaw-arbiter-daemon
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=WarsawArb1ter1111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL}
      - NOTIFICATION_FROM_EMAIL=payouts@warsaw-arbiter.io
      - PORT=8080
    ports:
      - "8080:8080"