version: "3.8"

services:
  warsaw-telemetry-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warsaw_telemetry_worker
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=WarsawEscrow111111111111111111111111111111111
      - COMMUNICATION_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_enterprise_key_placeholder
      - OPS_EMAIL=telemetry@blockchain-hack-warsaw.org
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"