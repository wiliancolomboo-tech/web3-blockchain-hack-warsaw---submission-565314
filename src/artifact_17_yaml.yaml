version: '3.8'

services:
  solwarsaw-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solwarsaw-enterprise-daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=Warsaw1111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - BUILDER_NOTIFY_EMAIL=organizer@blockchainhackwarsaw.com
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"