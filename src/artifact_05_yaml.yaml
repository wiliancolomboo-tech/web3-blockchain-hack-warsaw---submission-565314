version: "3.9"

services:
  solana-validator:
    image: solanalabs/solana:v1.18.15
    container_name: aegis-local-validator
    command: >
      solana-test-validator
      --reset
      --bpf-program AegisWarsaw1111111111111111111111111111111111 /opt/target/deploy/aegis_warsaw.so
      --rpc-port 8899
    ports:
      - "8899:8899"
      - "8900:8900"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://127.0.0.1:8899 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20

  aegis-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-automation-agent
    depends_on:
      solana-validator:
        condition: service_healthy
    environment:
      - SOLANA_RPC_URL=http://solana-validator:8899
      - PROGRAM_ID=AegisWarsaw1111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    restart: on-failure