[package]
name = "aegis_escrow"
version = "0.1.0"
description = "Autonomous Enterprise Milestone Escrow Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aegis_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.26"